<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia de Pensamiento Crítico</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen font-sans antialiased flex flex-col items-center justify-center p-4 md:p-8 relative overflow-x-hidden">

    <div id="anuncioTema" class="fixed inset-0 flex flex-col items-center justify-center z-50 bg-slate-950/80 backdrop-blur-md hidden pointer-events-none">
        <div class="text-center scale-50 opacity-0 transition-all duration-500 ease-out transform" id="anuncioCaja">
            <span class="text-xs font-black uppercase tracking-widest px-4 py-1.5 bg-yellow-500 text-slate-950 rounded-full shadow-lg shadow-yellow-500/20">
                ¡Tema Seleccionado!
            </span>
            <h1 id="anuncioTexto" class="text-5xl md:text-7xl font-black mt-4 text-white drop-shadow-[0_5px_15px_rgba(0,0,0,0.5)] tracking-wide uppercase">
                CATEGORÍA
            </h1>
        </div>
    </div>

    <header class="text-center max-w-xl mb-6">
        <h1 class="text-4xl md:text-5xl font-black bg-gradient-to-r from-teal-400 via-emerald-400 to-cyan-500 bg-clip-text text-transparent drop-shadow-sm mb-2">
            🧠 Trivia de Pensamiento Crítico
        </h1>
        <p class="text-slate-400 text-sm md:text-base">
            Desafía tus sesgos cognitivos, detecta falacias lógicas y pon a prueba tu razonamiento.
        </p>
    </header>

    <div class="relative flex flex-col items-center my-4">
        <div id="flecha" class="absolute right-[-10px] top-[135px] z-10 w-0 h-0 border-t-[15px] border-t-transparent border-b-[15px] border-b-transparent border-r-[25px] border-r-yellow-400 drop-shadow-lg transition-transform duration-75 origin-right"></div>
        
        <div class="p-2 bg-slate-900 rounded-full border-4 border-slate-800 shadow-2xl">
            <canvas id="ruletaCanvas" width="300" height="300" class="rounded-full"></canvas>
        </div>

        <button id="btnGirar" class="mt-6 px-8 py-3 bg-gradient-to-r from-teal-500 to-emerald-500 text-slate-950 font-extrabold rounded-xl text-lg tracking-wide hover:from-teal-400 hover:to-emerald-400 active:scale-95 transition-all shadow-lg cursor-pointer">
            🎰 Girar Ruleta
        </button>
    </div>

    <div class="text-sm uppercase tracking-widest font-mono bg-slate-900 px-4 py-1.5 rounded-full border border-slate-800 text-teal-400 font-bold mb-6">
        Puntaje Actual: <span id="marcadorPuntaje" class="text-white text-base ml-1">0</span>
    </div>

    <div id="contenedorPregunta" class="w-full max-w-2xl bg-slate-900 border border-slate-800 p-6 md:p-8 rounded-2xl shadow-2xl hidden animate-fadeIn">
        <div class="flex items-center justify-between mb-4">
            <span id="categoriaPregunta" class="text-xs font-bold uppercase tracking-widest px-3 py-1 bg-teal-500/10 text-teal-400 rounded-md border border-teal-500/20">
                Categoría
            </span>
        </div>

        <h2 id="textoPregunta" class="text-xl md:text-2xl font-bold leading-snug mb-6 text-slate-100">
            ¿Aquí irá la pregunta seleccionada?
        </h2>

        <div id="listaOpciones" class="grid grid-cols-1 gap-3.5"></div>

        <div id="feedbackResultado" class="mt-6 p-4 rounded-xl text-center text-base font-bold border hidden"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
